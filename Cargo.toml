[workspace]
resolver = "2"
members = [
    "crates/stackpulse-protocol",
    "crates/stackpulse-core",
    "crates/stackpulse-cli",
    "crates/stackpulse-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["StackPulse contributors"]
repository = "https://github.com/saasmaster/stackpulse-mac"

# Portability guard: the shared core and protocol must build for non-macOS
# targets. Keep platform-specific code out of these crates (see ADR-0005).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
