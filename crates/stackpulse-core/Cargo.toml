[package]
name = "stackpulse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable StackPulse engine: provider detection, local usage/cost scanning, pricing, and the request/response dispatcher. No platform-specific code."

[dependencies]
stackpulse-protocol = { path = "../stackpulse-protocol" }
serde.workspace = true
serde_json.workspace = true

# macOS-only: read Antigravity's SQLite conversation trajectories (Antigravity is
# a Mac app, so this only matters here). Scoped to the macOS target so the
# portable-core CI gates (Linux portability, Windows cross-compile) never pull a
# C toolchain; `bundled` keeps the macOS link self-contained (no external
# libsqlite3 for the Swift app to find).
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
# Integration tests (tests/*.rs) name protocol types directly.
stackpulse-protocol = { path = "../stackpulse-protocol" }

[features]
default = []
