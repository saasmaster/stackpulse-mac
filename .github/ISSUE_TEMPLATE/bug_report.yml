name: Bug report
description: Something StackPulse got wrong, crashed on, or reported inaccurately.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a precise report.

        **Before you paste anything: do NOT include raw session logs, prompts,
        source code, API keys, tokens, or Keychain contents.** StackPulse reads
        sensitive local files; an issue is a public place. The app can produce a
        **sanitized support bundle** for you (see the field below) that carries
        versions and status messages only, with paths redacted to `~`.

        For a suspected security vulnerability, do **not** open an issue — follow
        [SECURITY.md](https://github.com/stackpulse/stackpulse-mac/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behavior you observed.
      placeholder: e.g. The Claude cost for today shows $0.00 even though I have sessions from this morning.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought StackPulse would show or do instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to get from a clean state to the problem.
      placeholder: |
        1. Open StackPulse
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Which provider is affected
      description: The AI tool whose numbers look wrong. Choose "Not provider-specific" for app-wide issues.
      options:
        - Not provider-specific
        - Claude
        - Codex
        - Antigravity
        - Cursor
        - GitHub Copilot
        - Gemini
        - Grok
        - OpenCode
        - OpenRouter
        - Z.ai
        - Devin
        - Other / not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: App / core / protocol versions
      description: >-
        Run `stackpulse ping` for the core and protocol versions; the app
        version is in the app's Diagnostics screen (or `StackPulseApp --version`).
      placeholder: e.g. app 0.41.0, core 0.x.y, protocol 1.z
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.5 (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: support-bundle
    attributes:
      label: Sanitized support bundle (recommended)
      description: >-
        In the app, open **Diagnostics** and click **Copy support bundle**, then
        paste it here. It contains versions, status tokens, and short status
        messages only — no credentials, tokens, prompts, source, or log
        contents, and paths are redacted to `~`.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I have not pasted any raw session logs, prompts, tokens, keys, or credentials into this report.
          required: true
