name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Portability gate: the shared core must build + test on a non-macOS host.
  # This catches platform leakage before the Mac app is finished (ADR-0005).
  portable-core:
    name: Portable core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (portable crates, deny warnings)
        run: cargo clippy -p stackpulse-protocol -p stackpulse-core -p stackpulse-cli --all-targets -- -D warnings
      - name: Build portable crates
        run: cargo build -p stackpulse-protocol -p stackpulse-core -p stackpulse-cli
      - name: Test portable crates
        run: cargo test -p stackpulse-protocol -p stackpulse-core -p stackpulse-cli

  # Optional: prove a Windows cross-compile of the pure-logic crates.
  windows-cross:
    name: Windows cross-compile (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - name: Cross-build portable crates
        run: cargo build -p stackpulse-protocol -p stackpulse-core -p stackpulse-cli --target x86_64-pc-windows-gnu

  # Full macOS build: workspace + the Swift app + a headless data smoke test.
  macos-app:
    name: macOS app
    # macos-15, NOT macos-14: the runner's Swift toolchain has to satisfy
    # `swift-tools-version:6.0` and `.swiftLanguageMode(.v6)` in
    # apps/StackPulseMac/Package.swift. The macos-14 image ships Xcode 15 /
    # Swift 5.10, so SwiftPM refused the manifest before compiling a line —
    # "using Swift tools version 6.0.0 but the installed version is 5.10.0".
    #
    # That had been true since the initial commit, so this job had NEVER
    # passed: the `swift test` and `--selftest-parsers` steps below were added
    # to a job that could not start, and neither has ever actually run here.
    # Strict concurrency is load-bearing in this app (the store, the live
    # clients and the menu-bar renderer all depend on it), so the fix is a
    # newer toolchain, never a lower language mode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        # Printed before anything compiles: when this job breaks again, the
        # first question is always "which Swift did the runner have?", and a
        # whole CI round-trip to answer it is a round-trip too many.
        run: |
          swift --version
          xcodebuild -version || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (whole workspace incl. FFI, deny warnings)
        # The FFI crate (raw pointers, catch_unwind, C strings) is the trickiest
        # code in the repo and is macOS-only, so the Linux job can't lint it.
        # Lint the full workspace here so soundness lints in the bridge gate too.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace + release core
        run: cargo build --workspace && ./scripts/build-core.sh release
      - name: Test workspace
        run: cargo test --workspace
      - name: Build Swift app
        working-directory: apps/StackPulseMac
        run: swift build -c release
      - name: Test Swift app
        # The Swift half has a real XCTest/swift-testing suite; without this step
        # a Swift-layer regression (decoders, forecast latch, aggregates) merges
        # green. Debug build so tests actually run (release excludes test targets).
        working-directory: apps/StackPulseMac
        run: swift test
      - name: Parser self-tests (--selftest-parsers)
        working-directory: apps/StackPulseMac
        # `swift test` covers these self-tests directly, but the FLAG is what
        # `scripts/install-app.sh` runs to prove a shipped bundle really carries
        # this build's parsers. Nothing in CI invoked it, so the flag could rot —
        # a renamed or dropped self-test would silently stop being checked at
        # install time and no PR would notice. Run it here so the release gate
        # itself stays wired.
        run: ./.build/release/StackPulseApp --selftest-parsers

      - name: Headless snapshot smoke (Swift -> FFI -> core)
        working-directory: apps/StackPulseMac
        run: |
          ./.build/release/StackPulseApp --version
          # On a clean runner there are no provider logs; the snapshot must
          # still be valid JSON listing the providers.
          ./.build/release/StackPulseApp --dump | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["protocol_version"]["major"]==1; print("providers:", len(d["providers"]))'
